name: Mac app

# By hand only (Actions → Mac app → Run workflow): the Mac app's types, its build, its end-to-end
# tests against the demo, and the native shell compiling. Locally: npm run e2e in packages/mac.
on:
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/mac/src-tauri
      - run: npm ci
      - run: npm ci
        working-directory: packages/mac
      - run: npm run typecheck
        working-directory: packages/mac
      - run: npx vite build
        working-directory: packages/mac
      - run: npx playwright install --with-deps chromium
        working-directory: packages/mac
      - run: npm run e2e
        working-directory: packages/mac
        env:
          CI: '1'
      - name: The native shell compiles (with placeholders for the bundled daemon)
        working-directory: packages/mac/src-tauri
        run: |
          mkdir -p binaries resources/daemon
          ln -sf "$(which node)" binaries/node-aarch64-apple-darwin
          touch resources/daemon/.keep
          cargo clippy --all-targets -- -D warnings
          cargo test
