name: CI

# Every pull request: the types check and the tests pass (the terminal UI and the core), on
# Linux, macOS and Windows. And every push to main: PRs merge once their tests pass on a Mac, so a
# test that only fails on Linux or Windows shows on the commit that broke it, not on every PR after.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A PR's newer push replaces its run; each commit on main keeps its own, so a red one says which.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          # Windows is the slow one (git and starting programs take longer there): two runners
          # share its tests.
          - os: windows-latest
            shard: 1/2
          - os: windows-latest
            shard: 2/2
    runs-on: ${{ matrix.os }}
    steps:
      # A commit ending "Tested-on: macOS <its tree>" passed every test on a Mac with exactly
      # these files (scripts/local-pass.mjs): the macOS run would only repeat it.
      - name: Already tested on a Mac
        id: local
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          commit=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$SHA")
          tree=$(jq -r .tree.sha <<<"$commit")
          if jq -r .message <<<"$commit" | grep -qxF "Tested-on: macOS $tree"; then
            echo "Every test passed on a Mac for this commit's files: not running them again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # The tests read files byte for byte: no CRLF from Windows' checkout.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        if: steps.local.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.local.outputs.skip != 'true'
        with:
          node-version: 24
      - run: npm ci
        if: steps.local.outputs.skip != 'true'
      # The types check covers the Mac app's shared files too (its Markdown pipeline).
      - run: npm ci
        if: steps.local.outputs.skip != 'true'
        working-directory: packages/mac
      - run: npm run typecheck
        if: steps.local.outputs.skip != 'true'
      - run: npm test -- ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}
        if: steps.local.outputs.skip != 'true'

  # The server install (scripts/build-server.mjs, scripts/install.sh): built, installed as people
  # install it (no sudo, into ~/.beluga/server), started, asked how it is and stopped.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci
        working-directory: packages/mac
      - run: node scripts/build-server.mjs --os linux --arch x64 --out server-out
      - name: Install it as the one-line install does
        run: BELUGA_DOWNLOAD_URL="file://$PWD/server-out/beluga-server-linux-x64.tar.gz" sh server-out/install.sh
      - name: beluga up, status, project add, stop
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          beluga version
          beluga up
          beluga status
          beluga project add "$GITHUB_WORKSPACE"
          beluga project list
          beluga stop
          if beluga status; then echo 'still running after beluga stop'; exit 1; fi
      - name: beluga service install and remove (a systemd user service, kept after logout)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 40); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 0.5; done
          beluga service install
          for _ in $(seq 60); do beluga status >/dev/null && break; sleep 1; done
          beluga status
          systemctl --user is-active beluga.service
          beluga service remove
          sleep 2
          if beluga status; then echo 'still running after beluga service remove'; exit 1; fi
      - name: The daemon's log
        if: failure()
        run: cat ~/.beluga/logs/daemon.log || true
